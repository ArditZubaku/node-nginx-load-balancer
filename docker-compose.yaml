name: ${PROJECT_NAME}

services:
  server:
    pull_policy: build
    image: my_node_instance
    build:
      context: server
      dockerfile: Dockerfile
    env_file: .env
    deploy:
      replicas: 6
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    volumes:
      - my_node_volume:/server/node_modules

  reverse-proxy:
    pull_policy: build
    image: my_nginx_instance
    container_name: ${NGINX_CONTAINER_NAME}
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    build:
      context: reverse-proxy
      dockerfile: Dockerfile
    # No ports exposed on the server side, everything will go through nginx
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
    depends_on:
      - server

volumes:
  my_node_volume:
